<script>var phrases=["q1r will need q1o and q1s to help q1n become q1e.","q1e will need q1o and q1s to help q1r become q1n.","Judging q1n involves how a state of q1s affects the ability to vary q1e and to keep q1r. If all goes well, you'll achieve q1o.","When arguing q1n, the word q1s asks why the word q1e is a mystery but the word q1o will state how the word q1r is logic.","q1e will remind q1o how q1r relates to q1s, in return q1s can insure q1e that it is an active part of q1n.","q1r will remind q1s how q1e relates to q1o. In return, q1o can remind q1r that it's an action of q1n.","When relating to q1n, understanding q1r makes me think of q1o, which allows q1e to make sense of q1s.","You may try to raise up the q1e to find the q1n that can use q1r, or q1r can use q1n and raise the q1e.","When explaining q1n, it may be that q1s and q1e are actually a single factor that contain the multiple factors of q1o and q1r."]
